<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ahmed Farhan Real Estate</title>
<style>
body{margin:0;font-family:"Segoe UI",Arial;height:100vh;overflow:hidden}
.screen{position:absolute;width:100%;height:100%;top:0;left:0;transition:transform 1s ease}
#home{background:linear-gradient(to right, lightgreen 50%, black 50%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:28px}
.loading-btn{margin-top:20px;padding:12px 24px;background:#004d40;color:#fff;border:none;border-radius:6px}
#welcome{background:#eee;display:none;flex-direction:column;align-items:center;padding:40px;color:grey}
#welcome h1{margin-bottom:30px}
.sign-in-box{margin-bottom:20px}
.sign-in-box button{padding:12px 24px;background:#004d40;color:#fff;border:none;border-radius:6px;cursor:pointer}
.options-row{display:flex;gap:40px;justify-content:center;flex-wrap:wrap}
.option-box{background:#fff;padding:30px;width:260px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.2);text-align:center}
.option-box h2{margin:0 0 20px;color:#004d40}
.option-box button{padding:12px 24px;background:#004d40;color:#fff;border:none;border-radius:6px;cursor:pointer}
.books-box{background:#fff;padding:20px;width:90%;max-width:800px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.2);margin-top:30px;display:none}
.book-entry{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #ccc}
.book-entry button{padding:6px 12px;background:#004d40;color:#fff;border:none;border-radius:4px;cursor:pointer}
.houses-list{display:flex;flex-direction:column;gap:20px;margin-top:20px;width:90%;max-width:600px}
.house-card{background:#fff;padding:10px;border-radius:8px;box-shadow:0 4px 10px #0003;cursor:pointer;text-align:left}
.house-card img{width:100%;height:160px;object-fit:cover;border-radius:6px;margin-bottom:8px}
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
.popup-content{background:#fff;padding:20px;border-radius:12px;max-width:400px;width:90%;text-align:center}
.popup-content input{width:100%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:6px}
.popup-content button{padding:10px 20px;background:#004d40;color:#fff;border:none;border-radius:6px;margin-top:10px}
.slide-left{transform:translateX(-100%)}
</style>
</head>
<body>
<div id="home" class="screen">
  <div>Welcome to Ahmed Farhan’s Real Estate</div>
  <button class="loading-btn">Loading Site...</button>
</div>

<div id="welcome" class="screen">
  <h1>Welcome to Ahmed Farhan’s Real Estate LTD...</h1>
  <div class="sign-in-box"><button onclick="signIn()">Sign in with Gmail</button></div>
  <div class="options-row">
    <div class="option-box"><h2>Houses for Rent</h2><button onclick="openHouses()">Enter</button></div>
    <div class="option-box"><h2>Rent Your House</h2><button onclick="openRent()">Enter</button></div>
    <div class="option-box"><h2>Sell Your House</h2><button onclick="alert('Sell page coming soon!')">Enter</button></div>
  </div>
  <div class="books-box" id="booksBox">
    <h2>History</h2><div id="history"></div>
  </div>
</div>

<div id="houses" class="screen" style="display:none;flex-direction:column;align-items:center;padding:20px;">
  <h2>Available Houses</h2>
  <div class="houses-list" id="houseList"></div>
  <button onclick="goHome()">Home</button>
</div>

<div id="rent" class="screen" style="display:none;flex-direction:column;align-items:center;padding:20px;">
  <h2>Ahmed Farhan's Rentals</h2>
  <form>
    <input id="rentLoc" placeholder="Location" required>
    <input id="rentBuild" placeholder="Building No" required>
    <input id="rentZone" placeholder="Zone" required>
    <input id="rentStreet" placeholder="Street No" required>
    <button type="button" onclick="furtherReg()">Enter for further registration</button>
  </form>
</div>

<div class="popup" id="popup"><div class="popup-content" id="popupContent"></div></div>

<script>
let signedIn=false;
let historyList=[];
let housesData=[];

setTimeout(()=>{home.classList.add("slide-left");welcome.style.display="flex"},5000);

function signIn(){signedIn=true;alert("Signed in successfully!");booksBox.style.display="block";}

function goHome(){document.querySelectorAll('.screen').forEach(s=>s.style.display='none');welcome.style.display="flex"}

function openHouses(){
  if(!signedIn){alert("Please sign in first!");return;}
  welcome.style.display="none";houses.style.display="flex";
  housesData=[];
  for(let i=1;i<=10;i++){
    housesData.push({location:"Location "+i,building:"B"+i,street:"S"+i,zone:"Z"+i,price:"$"+(1000+i*100)});
  }
  houseList.innerHTML="";
  housesData.forEach((h,i)=>{
    houseList.innerHTML+=`<div class="house-card" onclick="showHouseDetails(${i})">
      <img src="https://via.placeholder.com/600x160">
      <div><strong>${h.location}</strong><br>Building:${h.building}, Street:${h.street}, Zone:${h.zone}<br>Expected Price:${h.price}</div>
    </div>`;
  });
}

function showHouseDetails(i){
  let h=housesData[i];
  showPopup(`<h3>${h.location}</h3>
    <p>Building No: ${h.building}<br>Street No: ${h.street}<br>Zone No: ${h.zone}<br>Expected Price: ${h.price}</p>
    <button onclick="registerHouse(${i})">Register</button>`);
}

function registerHouse(i){
  showPopup(`<h3>Our workforce will contact you</h3>
    <p>Please supply the required details:</p>
    <input id='contact' placeholder='Enter Contact No'>
    <input id='email' placeholder='Enter Email'>
    <button onclick='finishRegister(${i})'>Registered</button>`);
}

function finishRegister(i){
  if(!contact.value||!email.value){alert("Fill all");return}
  closePopup();goHome();
  historyList.push(i);
  updateHistory();
}

function openRent(){
  if(!signedIn){alert("Please sign in first!");return;}
  welcome.style.display="none";rent.style.display="flex";
}

function furtherReg(){
  showPopup(`<h3>Enter Contact Details</h3>
    <input id='rentContact' placeholder='Enter Contact No'>
    <p>Our staff will contact you for completing registration.</p>
    <p>Thank you!</p>
    <button onclick='doneRent()'>Done</button>`);
}

function doneRent(){
  if(!rentContact.value){alert("Fill contact");return}
  closePopup();goHome();
}

function updateHistory(){
  history.innerHTML=historyList.map((idx)=>`<div class='book-entry'>${housesData[idx]?.location||"House "+(idx+1)}<button onclick="showHouseDetails(${idx})">Show</button></div>`).join("");
}

function showPopup(html){popupContent.innerHTML=html;popup.style.display='flex'}
function closePopup(){popup.style.display='none'}
</script>
</body>
</html>
